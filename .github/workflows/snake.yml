name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF3131&color_dots=#000000,#ff8080,#ff4d4d,#ff1a1a,#cc0000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF3131&color_dots=#000000,#ff8080,#ff4d4d,#ff1a1a,#cc0000

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
